<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Captura de prompt</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <h1>Analizador de prompt</h1>

        <section class="card">

            <form id="analysis-form">

                <div class="form-group">

                    <textarea name="prompt" id="prompt" rows="10" cols="100">
                    Ingresa el prompt que quieras validar
                    </textarea>

                </div>


                <button
                    type="submit"
                    id="analyze-button"
                >
                    Enviar prompt
                </button>

            </form>

        </section>


        <section
            class="card result-card"
            id="result-container"
            hidden
        >

            <h2>Resultado</h2>

            <div id="summary"></div>

            <h3>Elementos detectados</h3>

            <div id="elements"></div>

            <details>

                <summary>
                    Ver JSON
                </summary>

                <pre id="json-result"></pre>

            </details>

        </section>


        <div
            id="loading"
            class="loading"
            hidden
        >
            Analizando prompt...
        </div>


        <div
            id="error"
            class="error"
            hidden
        ></div>

    </main>


    <script src="/static/app_llava_prompt.js"></script>

</body>

</html>
