<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Analizador de imágenes</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <main class="container">

        <h1>Analizador de imágenes</h1>

        <p class="subtitle">
            Selecciona una fotografía para analizarla con LLaVA
        </p>

        <section class="card">

            <form id="analysis-form">

                <div class="form-group">

                    <label>
                        Selecciona una fotografía
                    </label>

                    <div class="carousel">

                        <button
                            type="button"
                            class="carousel-button"
                            id="prev-button"
                        >
                            ❮
                        </button>


                        <div
                            class="carousel-track-container"
                            id="carousel-container"
                        >

                            <div
                                class="carousel-track"
                                id="carousel-track"
                            >
                                <!--
                                    Las imágenes se generan
                                    dinámicamente desde app.js
                                -->
                            </div>

                        </div>


                        <button
                            type="button"
                            class="carousel-button"
                            id="next-button"
                        >
                            ❯
                        </button>

                    </div>

                </div>


                <div class="preview-container">

                    <img
                        id="image-preview"
                        alt="Imagen seleccionada"
                    >

                </div>


                <button
                    type="submit"
                    id="analyze-button"
                >
                    Analizar fotografía
                </button>

            </form>

        </section>


        <section
            class="card result-card"
            id="result-container"
            hidden
        >

            <h2>Resultado</h2>

            <div id="summary"></div>

            <h3>Elementos detectados</h3>

            <div id="elements"></div>

            <details>

                <summary>
                    Ver JSON
                </summary>

                <pre id="json-result"></pre>

            </details>

        </section>


        <div
            id="loading"
            class="loading"
            hidden
        >
            Analizando imagen...
        </div>


        <div
            id="error"
            class="error"
            hidden
        ></div>

    </main>


    <script src="/static/app.js"></script>

</body>

</html>
